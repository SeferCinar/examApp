name: validate

on:
  push:
    branches: [master]
  pull_request:
    paths:
      - 'configs/**'
      - 'scripts/validate-configs.ts'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/validate.yml'

jobs:
  validate-configs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci

      - run: npm run validate
